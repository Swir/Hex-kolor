  <text x="1090" y="108" text-anchor="end" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">IN PROGRESS</text>
  <rect x="50" y="126" width="1100" height="24" rx="12" fill="#08131F"/><rect x="50" y="126" width="550" height="24" rx="12" fill="url(#fill)"/>
  <text x="50" y="169" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Example only: 5 / 10 verified items</text>
