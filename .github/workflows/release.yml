name: Build, verify and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'VERSION'
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'release-config.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify Windows package
        run: python scripts/release_tools.py build
      - name: Retain verified build
        uses: actions/upload-artifact@v4
        with:
          name: verified-windows-package
          path: release/*
          if-no-files-found: error
      - name: Verify fresh draft download and publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_tools.py publish
